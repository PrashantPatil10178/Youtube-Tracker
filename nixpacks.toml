# Coolify deploy config (Nixpacks build pack).
# Uses bun (bun.lock is the lockfile of record); node is kept alongside it
# since Next's CLI binary is invoked via a node shebang. No native-toolchain
# packages needed — sharp is the only compiled dependency left and ships a
# prebuilt binary for linux-x64 glibc.

[phases.setup]
nixPkgs = ['nodejs_22', 'bun']

[phases.install]
cmds = ['bun install --frozen-lockfile']

[phases.build]
cmds = ['bun run build']

[start]
cmd = 'bun run start -- -p ${PORT:-3000}'

[variables]
NODE_ENV = 'production'
NEXT_TELEMETRY_DISABLED = '1'
